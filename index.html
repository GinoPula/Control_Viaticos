  }
  .building-bg::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 20% 15%, rgba(217,26,42,0.06), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(217,26,42,0.05), transparent 50%);
  }

  .glass{
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: 0 12px 40px rgba(20,25,35,0.15);
  }
  .glass-soft{
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.4);
  }
  .glass-panel-alert{
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(217,26,42,0.35);
  }

  .logo-badge-img{
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display:inline-flex;
    padding: 4px;
  }
  .logo-badge-img img{
    height: 56px;
    width: auto;
    display:block;
    border-radius: 6px;
  }
  @media (max-width: 480px){
    .logo-badge-img img{ height: 40px; }
  }

  .tab-pill{
    transition: all .2s ease;
  }
  .tab-pill-active{
    background: linear-gradient(135deg, var(--rojo), var(--rojo-oscuro));
    box-shadow: 0 4px 16px rgba(217,26,42,0.4);
    color:#fff;
  }

  .cat-chip{
    transition: all .16s ease;
    white-space: nowrap;
  }
  .cat-chip:hover{ transform: translateY(-1px); }
  .cat-chip-active{
    background: linear-gradient(135deg, var(--rojo), var(--rojo-oscuro));
    border-color: transparent !important;
    color:#fff;
  }

  input, select, textarea{
    background: rgba(255,255,255,0.35) !important;
    border: 1px solid rgba(30,37,48,0.15) !important;
    color: #1e2530 !important;
  }
  input::placeholder, textarea::placeholder{ color: rgba(30,37,48,0.4); }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color: var(--rojo) !important;
    box-shadow: 0 0 0 3px rgba(217,26,42,0.2);
  }
  input:disabled{ opacity: 0.5; }

  .progress-track{
    background: rgba(30,37,48,0.12);
    border-radius: 999px;
    overflow:hidden;
    height: 10px;
    border: 1px solid rgba(30,37,48,0.08);
  }
  .progress-fill{ height:100%; transition: width .4s ease, background .4s ease; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(217,26,42,0.5); border-radius:8px; }

  .btn-export{
    background: linear-gradient(135deg,#D91A2A,#8f0e1a);
    box-shadow: 0 6px 22px rgba(217,26,42,0.35);
  }
  .btn-export:hover{ filter: brightness(1.12); }
  .btn-export:disabled{ filter: grayscale(0.4); }

  .table-glass thead{ background: rgba(217,26,42,0.14); }
  .table-glass tbody tr{ border-bottom: 1px solid rgba(30,37,48,0.08); }
  .table-glass tbody tr:hover{ background: rgba(255,255,255,0.25); }

  .badge{ font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight:600; }

  .alert-circle{
    width:44px; height:44px;
    border-radius:999px;
    background: radial-gradient(circle, #ff3b3b, #b30f1f);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 6px rgba(255,59,59,0.18);
    animation: pulseCircle 1.6s infinite;
  }
  @keyframes pulseCircle{
    0%,100%{ box-shadow: 0 0 0 6px rgba(255,59,59,0.18); }
    50%{ box-shadow: 0 0 0 12px rgba(255,59,59,0.05); }
  }
</style>

// Hook: captura el evento de instalación PWA (Android/Chrome/Edge)
function useInstallPrompt(){
  const [prompt, setPrompt] = useState(null);
  const [installed, setInstalled] = useState(false);

  React.useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setPrompt(e); };
    const onInstalled = () => { setInstalled(true); setPrompt(null); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    window.addEventListener("appinstalled", onInstalled);
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
      setInstalled(true);
    }
    return () => {
      window.removeEventListener("beforeinstallprompt", onPrompt);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  return { prompt, installed, clear: () => setPrompt(null) };
}

function InstallButton(){
  const { prompt, installed, clear } = useInstallPrompt();
  const [showIOSHint, setShowIOSHint] = useState(false);
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  if (installed) return null;

  const handleAndroidInstall = async () => {
    if (!prompt) return;
    prompt.prompt();
    await prompt.userChoice;
    clear();
  };

  if (prompt) {
    return (
      <button onClick={handleAndroidInstall}
        className="btn-export text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 whitespace-nowrap">
        📲 Instalar App
      </button>
    );
  }

  if (isIOS) {
    return (
      <div className="relative">
        <button onClick={() => setShowIOSHint(v => !v)}
          className="btn-export text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 whitespace-nowrap">
          📲 Instalar App
        </button>
        {showIOSHint && (
          <div className="absolute right-0 mt-2 w-64 glass rounded-xl p-3 text-[11px] text-slate-700 z-50 shadow-xl">
            <p className="font-semibold mb-1 text-slate-800">Para instalar en iPhone:</p>
            <p>1. Toca el ícono <b>Compartir</b> (□↑) en Safari.</p>
            <p>2. Elige <b>"Añadir a pantalla de inicio"</b>.</p>
            <button onClick={() => setShowIOSHint(false)}
              className="mt-2 text-red-700 font-semibold text-[11px]">Cerrar</button>
          </div>
        )}
      </div>
    );
  }

  return null;
}

      alert("Complete la fecha y un monto válido mayor a S/ 0.00");
      return;

    if (tipoSustento === "con" && !razonSocial.trim()){
      alert("Ingrese la Razón Social / Nombre del proveedor.");
      return;
    }
    onAdd({
      id: uid(),
      fecha,
      tipoSustento,
      categoria,
      monto: montoNum,
      tipoDocumento: tipoSustento === "con" ? tipoDocumento : "Declaración Jurada",

      detalle,
    });
    setMonto("");
    setNumeroDocumento("");
    setRazonSocial("");
    setConceptoGastoDJ("");
    setDetalle("");
  };

  return (
    <div className="glass rounded-2xl p-5">

function ProgressBar({ label, value, max }){
  const pct = Math.min((value / max) * 100, 100);
  let color = "#22c55e";
  if (value > max) color = "#D91A2A";
  else if (value / max > 0.75) color = "#facc15";
  return (
    <div className="mb-3">
      <div className="flex justify-between text-[11px] mb-1">
        <span className="text-slate-700">{label}</span>
        <span className="font-semibold" style={{color}}>{currency(value)} / {currency(max)} max</span>
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{width: pct + "%", background: color}}></div>
      </div>
    </div>
  );
}

// ==== Exportación a Excel usando las plantillas oficiales (Anexo 03 / Anexo 04) ====
// En vez de generar un Excel desde cero, se edita directamente el XML interno de las
// plantillas .xlsx originales (son archivos ZIP) para preservar el logo, bordes,
// colores y textos legales exactos, escribiendo solo los valores en las celdas de datos.

const SS_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const XML_NS = "http://www.w3.org/XML/1998/namespace";
const EXCEL_EPOCH_MS = Date.UTC(1899, 11, 30);

function dateToExcelSerial(isoDate){
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-").map(Number);
  const ms = Date.UTC(y, m - 1, d);
  return Math.round((ms - EXCEL_EPOCH_MS) / 86400000);
}

function getCell(doc, ref){
  return doc.querySelector(`c[r="${ref}"]`);
}

function setCellNumber(doc, ref, value){
  const c = getCell(doc, ref);
  if (!c) return;
  c.removeAttribute("t");
  const oldIs = c.getElementsByTagName("is")[0];
  if (oldIs) c.removeChild(oldIs);
  let v = c.getElementsByTagName("v")[0];
  if (!v) { v = doc.createElementNS(SS_NS, "v"); c.appendChild(v); }
  v.textContent = String(value);
}

function setCellText(doc, ref, text){
  const c = getCell(doc, ref);
  if (!c) return;
  const oldV = c.getElementsByTagName("v")[0];
  if (oldV) c.removeChild(oldV);
  c.setAttribute("t", "inlineStr");
  let is = c.getElementsByTagName("is")[0];
  if (!is) { is = doc.createElementNS(SS_NS, "is"); c.appendChild(is); }
  while (is.firstChild) is.removeChild(is.firstChild);
  const t = doc.createElementNS(SS_NS, "t");
  t.setAttributeNS(XML_NS, "xml:space", "preserve");
  t.textContent = text == null ? "" : String(text);
  is.appendChild(t);
}

function shiftRefRowTokens(str, thresholdRow, shiftBy){
  return str.replace(/([A-Z]{1,3})(\d+)/g, (m, col, row) => {
    const r = parseInt(row, 10);
    return col + (r >= thresholdRow ? (r + shiftBy) : r);
  });
}

function getSheetDataEl(doc){
  return doc.getElementsByTagName("sheetData")[0];
}

function getRowEl(sheetDataEl, rowNum){
  return sheetDataEl.querySelector(`row[r="${rowNum}"]`);
}

// Inserta `count` filas clonando el estilo de `templateRowNum`, justo después de
// `afterRow`, desplazando hacia abajo todo lo que esté debajo (incluida la fila TOTAL).
function insertExtraRows(sheetDataEl, templateRowNum, afterRow, count){
  if (count <= 0) return;
  const rowsBelow = Array.from(sheetDataEl.querySelectorAll("row"))
    .filter(r => parseInt(r.getAttribute("r"), 10) > afterRow)
    .sort((a, b) => parseInt(b.getAttribute("r"), 10) - parseInt(a.getAttribute("r"), 10));
  rowsBelow.forEach(row => {
    const newR = parseInt(row.getAttribute("r"), 10) + count;
    row.setAttribute("r", String(newR));
    Array.from(row.getElementsByTagName("c")).forEach(c => {
      const col = c.getAttribute("r").match(/^[A-Z]+/)[0];
      c.setAttribute("r", col + newR);
    });
  });

  const templateRow = getRowEl(sheetDataEl, templateRowNum);
  let anchor = getRowEl(sheetDataEl, afterRow);
  for (let i = 0; i < count; i++){
    const newRowNum = afterRow + 1 + i;
    const clone = templateRow.cloneNode(true);
    clone.setAttribute("r", String(newRowNum));
    Array.from(clone.getElementsByTagName("c")).forEach(c => {
      const col = c.getAttribute("r").match(/^[A-Z]+/)[0];
      c.setAttribute("r", col + newRowNum);
      const v = c.getElementsByTagName("v")[0]; if (v) c.removeChild(v);
      const is = c.getElementsByTagName("is")[0]; if (is) c.removeChild(is);
      c.removeAttribute("t");
    });
    anchor.parentNode.insertBefore(clone, anchor.nextSibling);
    anchor = clone;
  }

  const ownerDoc = sheetDataEl.ownerDocument;
  Array.from(ownerDoc.getElementsByTagName("mergeCell")).forEach(mc => {
    mc.setAttribute("ref", shiftRefRowTokens(mc.getAttribute("ref"), afterRow + 1, count));
  });
  const dim = ownerDoc.getElementsByTagName("dimension")[0];
  if (dim) dim.setAttribute("ref", shiftRefRowTokens(dim.getAttribute("ref"), afterRow + 1, count));
}

async function buildWorkbookFromTemplate(templateUrl, mutateFn){
  const res = await fetch(templateUrl);
  if (!res.ok) throw new Error("No se encontró la plantilla " + templateUrl + " (colócala junto a index.html)");
  const buf = await res.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);

  const sheetPath = "xl/worksheets/sheet1.xml";
  const sheetXmlText = await zip.file(sheetPath).async("text");
  const doc = new DOMParser().parseFromString(sheetXmlText, "application/xml");

  mutateFn(doc);

  zip.file(sheetPath, new XMLSerializer().serializeToString(doc));

  // El calcChain queda obsoleto si se insertaron filas; se quita y se fuerza recálculo.
  if (zip.file("xl/calcChain.xml")){
    zip.remove("xl/calcChain.xml");
    const ctPath = "[Content_Types].xml";
    let ct = await zip.file(ctPath).async("text");
    zip.file(ctPath, ct.replace(/<Override[^>]*calcChain\.xml[^>]*\/>/, ""));
    const relsPath = "xl/_rels/workbook.xml.rels";
    let rels = await zip.file(relsPath).async("text");
    zip.file(relsPath, rels.replace(/<Relationship[^>]*calcChain\.xml[^>]*\/>/, ""));
  }
  const wbPath = "xl/workbook.xml";
  let wbXml = await zip.file(wbPath).async("text");
  if (wbXml.includes("<calcPr") && !wbXml.includes("fullCalcOnLoad")){
    wbXml = wbXml.replace(/<calcPr([^/]*)\/>/, (m, attrs) => `<calcPr${attrs} fullCalcOnLoad="1"/>`);
    zip.file(wbPath, wbXml);
  }

  return zip.generateAsync({
    type: "blob",
    mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function exportAnexo03(gastos, comision){
  const items = gastos.filter(g => g.tipoSustento === "con");
  if (!items.length) return;
  const CAPACITY = 15; // filas 11 a 25 en la plantilla oficial
  const extra = Math.max(0, items.length - CAPACITY);

  const blob = await buildWorkbookFromTemplate("Anexo_03_-_Rendicion_gastos_con_comprobantes.xlsx", (doc) => {
    const sheetDataEl = getSheetDataEl(doc);
    if (extra > 0) insertExtraRows(sheetDataEl, 25, 25, extra);

    items.forEach((g, i) => {
      const row = 11 + i;
      setCellNumber(doc, `A${row}`, dateToExcelSerial(g.fecha));
      setCellText(doc, `B${row}`, g.tipoDocumento || "");
      setCellText(doc, `C${row}`, g.numeroDocumento || "");
      setCellText(doc, `D${row}`, g.razonSocial || "");
      setCellText(doc, `E${row}`, g.detalle || "");
      setCellNumber(doc, `F${row}`, g.monto);
    });

    const totalRow = 26 + extra;
    setCellNumber(doc, `F${totalRow}`, items.reduce((s, g) => s + g.monto, 0));
    const f = getCell(doc, `F${totalRow}`).getElementsByTagName("f")[0];
    if (f) f.textContent = `SUM(F11:F${25 + extra})`;
  });

  downloadBlob(blob, `Anexo03_${(comision.nombre || "Comisionado").replace(/\s+/g, "_")}_${todayISO()}.xlsx`);
}

async function exportAnexo04(gastos, comision){
  const items = gastos.filter(g => g.tipoSustento === "sin");
  if (!items.length) return;
  const CAPACITY = 9; // filas 13 a 21 en la plantilla oficial
  const extra = Math.max(0, items.length - CAPACITY);

  const blob = await buildWorkbookFromTemplate("Anexo_04_-_Rendicion_gastos_sin_comprobantes.xlsx", (doc) => {
    const sheetDataEl = getSheetDataEl(doc);
    if (extra > 0) insertExtraRows(sheetDataEl, 21, 21, extra);

    items.forEach((g, i) => {
      const row = 13 + i;
      setCellNumber(doc, `A${row}`, dateToExcelSerial(g.fecha));
      setCellText(doc, `B${row}`, g.conceptoGastoDJ || "");
      setCellText(doc, `C${row}`, g.detalle || "");
      setCellNumber(doc, `D${row}`, g.monto);
    });

    const totalRow = 22 + extra;
    setCellNumber(doc, `D${totalRow}`, items.reduce((s, g) => s + g.monto, 0));
    const f = getCell(doc, `D${totalRow}`).getElementsByTagName("f")[0];
    if (f) f.textContent = `SUM(D13:D${21 + extra})`;

    if (comision.nombre || comision.dni){
      const nombre = comision.nombre || "____________________";
      const dni = comision.dni || "________";
      setCellText(doc, "A9",
        `Yo, ${nombre}, identificado con DNI Nº ${dni}, prestando servicio en el PNC, con domicilio en ____________________, declaro bajo juramento haber efectuado gastos en mi comisión de servicios, los cuales me fueron imposible obtener comprobantes de pago que sustentes los gastos, el cual se detalla en el siguiente cuadro:`
      );
    }
  });

  downloadBlob(blob, `Anexo04_${(comision.nombre || "Comisionado").replace(/\s+/g, "_")}_${todayISO()}.xlsx`);
}

async function exportarExcel(gastos, comision){
  const tieneCon = gastos.some(g => g.tipoSustento === "con");
  const tieneSin = gastos.some(g => g.tipoSustento === "sin");
  if (!tieneCon && !tieneSin) return;
  try {
    if (tieneCon) await exportAnexo03(gastos, comision);
    if (tieneSin){
      if (tieneCon) await new Promise(r => setTimeout(r, 500));
      await exportAnexo04(gastos, comision);
    }
  } catch (err){
    console.error(err);
    alert("No se pudo generar el Excel con la plantilla oficial:\n" + err.message);
  }
}

function ReportesResumen({ gastos }){
  const totalCon = gastos.filter(g => g.tipoSustento === "con").reduce((s,g) => s + g.monto, 0);

        <div className="text-[10px] text-slate-600">Con Comprobante</div>

      </div>
      <div className="glass-soft rounded-xl p-3 text-center">

        <div className="text-lg font-bold text-yellow-400">{currency(totalSin)}</div>
      </div>
      <div className="glass-soft rounded-xl p-3 text-center">
        <div className="text-[10px] text-slate-600">Total General</div>
        <div className="text-lg font-bold text-slate-800">{currency(totalCon + totalSin)}</div>
      </div>
    </div>
  );
}

function App(){

  const hoy = todayISO();
  const gastosHoy = useMemo(() => gastos.filter(g => g.fecha === hoy), [gastos, hoy]);
  const totalHoy = useMemo(() => gastosHoy.reduce((s,g) => s + g.monto, 0), [gastosHoy]);
  const totalDJHoy = useMemo(() => gastosHoy.filter(g => g.tipoSustento === "sin").reduce((s,g) => s + g.monto, 0), [gastosHoy]);

  const addGasto = (g) => setGastos(prev => [g, ...prev]);
  const deleteGasto = (id) => setGastos(prev => prev.filter(g => g.id !== id));

  return (
    <div className="min-h-screen flex items-start sm:items-center justify-center px-2 sm:px-3 py-4 sm:py-6">
      <div className="w-full max-w-5xl">
        <div className="mb-3 sm:mb-4 flex items-start justify-between gap-2">
          <LogoBadge />
          <InstallButton />
        </div>

        <div className="glass rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 md:p-7">
          <p className="text-[10px] sm:text-[11px] text-slate-600 mb-1.5">
            <span className="font-bold">Autor:</span> <span className="font-bold">Administrativo Luis Alfredo Vente Tello</span>
          </p>
          <h1 className="text-base sm:text-lg md:text-xl font-bold text-slate-800 tracking-wide mb-4 leading-snug">
            REGISTRO Y RENDICIÓN DE VIÁTICOS - COMISIÓN DE SERVICIO - (Administración)
          </h1>

          <Tabs active={activeTab} setActive={setActiveTab} />
          <ComisionForm comision={comision} setComision={setComision} />

          {activeTab === "nuevo" && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4">
              <NuevoGastoForm onAdd={addGasto} />
              <IndicadoresPanel gastosHoy={gastosHoy} totalHoy={totalHoy} totalDJHoy={totalDJHoy} gastos={gastos} comision={comision} />
            </div>
          )}

          {activeTab === "resumen" && (
            <div>
              <IndicadoresPanel gastosHoy={gastosHoy} totalHoy={totalHoy} totalDJHoy={totalDJHoy} gastos={gastos} comision={comision} />
              <TablaGastos gastos={gastosHoy} onDelete={deleteGasto} />
            </div>
          )}

          {activeTab === "reportes" && (
            <div>
              <ReportesResumen gastos={gastos} />
              <button
                onClick={() => exportarExcel(gastos, comision)}
                disabled={gastos.length === 0}
                className="w-full btn-export disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-xl text-xs tracking-wide transition mb-2"
              >
                📊 EXPORTAR EXCEL (Anexo 03 / 04)
              </button>
              <TablaGastos gastos={gastos} onDelete={deleteGasto} />
            </div>
          )}
        </div>

        <footer className="text-center text-[10px] text-slate-400 mt-4 pb-2">
          Ministerio de Vivienda, Construcción y Saneamiento — Sistema de Control y Rendición de Viáticos
        </footer>
      </div>
    </div>
  );
}
